services:
  db:
    # Usamos la imagen oficial de pgvector para PostgreSQL 16.
    # Así no dependemos de instalar la extensión a mano dentro del contenedor.
    image: pgvector/pgvector:pg16
    container_name: archivum-db
    environment:
      POSTGRES_USER: archivum
      POSTGRES_PASSWORD: archivum
      POSTGRES_DB: archivum
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: archivum-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  pgdata: {}