# docker-compose.yml

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: archivum-db
    environment:
      POSTGRES_USER: archivum
      POSTGRES_PASSWORD: archivum
      POSTGRES_DB: archivum
    ports:
      - "5433:5432"
    volumes:
      - archivum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archivum -d archivum"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: archivum-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archivum-backend
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - archivum_uploads:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archivum-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: archivum-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

volumes:
  archivum_pgdata:
  archivum_uploads: