services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: archivum
      POSTGRES_PASSWORD: archivum
      POSTGRES_DB: archivum
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: archivum-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]

volumes:
  pgdata: {}